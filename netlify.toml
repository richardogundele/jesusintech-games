[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# the game is built into /games/ so jesusintech.com/games can proxy it
[[redirects]]
  from = "/"
  to = "/games/"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
