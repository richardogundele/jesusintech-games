[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# served from the root of driveuk.jesusintech.com (2026-10-27); the old games.jesusintech.com and
# jesusintech.com/games redirect here
[[redirects]]
  from = "https://games.jesusintech.com/*"
  to = "https://driveuk.jesusintech.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
